<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23110800' stroke='%23ff6600' stroke-width='4'/><circle cx='50' cy='50' r='18' fill='%23ff8800'/><circle cx='50' cy='50' r='6' fill='%23ffcc00'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#080400;--bg2:#0c0600;--bg3:#120a00;
--accent:#ff6600;--accent2:#ff9900;--accent3:#cc4400;
--fire1:#ff4400;--fire2:#ff8800;--fire3:#ffcc00;--fire4:#ffee88;
--green:#00ff88;--yellow:#ffcc00;--red:#ff3344;--blue:#00aaff;
--tx:#e8d0b0;--tx2:#8a7060;--tx3:#4a3828;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--tx)}

/* BOOT SCREEN */
#bootScreen{
  position:fixed;inset:0;z-index:9999;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1s;
}
#bootScreen.done{opacity:0;pointer-events:none}
.boot-arc{position:relative;width:300px;height:300px}
.boot-arc canvas{width:100%;height:100%}
.boot-text{
  font-family:'Share Tech Mono',monospace;color:var(--accent);
  font-size:13px;letter-spacing:2px;text-align:center;margin-top:20px;
  min-height:80px;
}
.boot-progress{
  width:300px;height:3px;background:#1a0a00;border-radius:2px;margin-top:16px;overflow:hidden;
}
.boot-progress-bar{
  height:100%;width:0%;background:linear-gradient(90deg,var(--fire1),var(--fire2),var(--fire3));
  border-radius:2px;transition:width .3s;
}

/* MAIN APP */
.app{display:flex;height:100vh;overflow:hidden;opacity:0;transition:opacity .5s}
.app.visible{opacity:1}

.left-panel{
  width:360px;min-width:360px;
  background:linear-gradient(180deg,#0a0500 0%,#120800 50%,#0a0500 100%);
  border-right:1px solid rgba(255,102,0,.1);
  display:flex;flex-direction:column;align-items:center;
  padding:24px 20px;position:relative;overflow:hidden;
}
.left-panel::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at center 35%,rgba(255,102,0,.04) 0%,transparent 70%);
  pointer-events:none;
}

.jarvis-title{
  font-family:'Orbitron',monospace;font-size:26px;font-weight:900;
  letter-spacing:6px;
  background:linear-gradient(135deg,var(--fire1),var(--fire2),var(--fire3),var(--fire4));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:2px;
}
.jarvis-sub{
  font-family:'Share Tech Mono',monospace;font-size:9px;
  color:var(--tx3);letter-spacing:3px;text-transform:uppercase;margin-bottom:16px;
}

.reactor-wrap{
  position:relative;width:280px;height:280px;margin:0 0 16px;
  perspective:800px;
}
.reactor-canvas{width:100%;height:100%;display:block}

.status-text{
  font-family:'Share Tech Mono',monospace;font-size:12px;
  color:var(--accent);letter-spacing:3px;text-transform:uppercase;
  margin-bottom:16px;min-height:18px;
}

.controls{width:100%;display:flex;flex-direction:column;gap:10px}
.ctrl-row{display:flex;align-items:center;gap:10px}
.ctrl-label{
  font-family:'Share Tech Mono',monospace;font-size:10px;
  color:var(--tx3);letter-spacing:1px;min-width:50px;
}
.ctrl-select{
  flex:1;background:var(--bg3);border:1px solid var(--tx3);
  border-radius:6px;color:var(--tx);padding:6px 10px;
  font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;
}
.ctrl-select option{background:var(--bg2);color:var(--tx)}

.mic-btn{
  width:60px;height:60px;border-radius:50%;border:2px solid var(--tx3);
  background:linear-gradient(135deg,var(--bg3),var(--bg2));
  color:var(--accent);font-size:24px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  margin:8px 0;transition:all .3s;position:relative;
}
.mic-btn:hover{border-color:var(--accent);box-shadow:0 0 20px rgba(255,102,0,.3)}
.mic-btn.active{
  border-color:var(--green);color:var(--green);
  animation:micGlow 1.5s infinite;
}
@keyframes micGlow{
  0%,100%{box-shadow:0 0 10px rgba(0,255,136,.3)}
  50%{box-shadow:0 0 25px rgba(0,255,136,.5)}
}

.quick-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;margin-top:10px;
}
.quick-btn{
  padding:7px;border:1px solid rgba(255,102,0,.12);border-radius:8px;
  background:rgba(255,102,0,.03);color:var(--tx2);font-size:11px;
  font-family:'Rajdhani',sans-serif;cursor:pointer;text-align:center;
  transition:all .2s;
}
.quick-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,102,0,.08)}

.right-panel{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0}

.top-bar{
  height:48px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid rgba(255,102,0,.08);
  background:rgba(10,5,0,.8);backdrop-filter:blur(10px);
}
.top-left{display:flex;align-items:center;gap:10px}
.status-dot{
  width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px var(--accent);
}
.top-name{font-family:'Orbitron',monospace;font-size:11px;font-weight:600;color:var(--tx);letter-spacing:2px}
.top-status{font-size:10px;color:var(--tx3);letter-spacing:1px}
.top-time{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--tx3)}

.chat-area{
  flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;
}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:var(--tx3);border-radius:2px}

.welcome-center{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:12px;opacity:.3;
}

.msg{display:flex;gap:10px;animation:msgIn .4s;max-width:85%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.ai{align-self:flex-start}
.msg-avatar{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.msg.ai .msg-avatar{background:linear-gradient(135deg,var(--accent3),#2a1000);border:1px solid var(--accent)}
.msg.user .msg-avatar{background:#1a1a25;border:1px solid var(--tx3)}

.msg-bubble{padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.7}
.msg.ai .msg-bubble{
  background:linear-gradient(135deg,rgba(255,102,0,.06),rgba(255,102,0,.02));
  border:1px solid rgba(255,102,0,.1);border-top-left-radius:4px;
}
.msg.user .msg-bubble{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-top-right-radius:4px;
}
.msg-name{
  font-family:'Orbitron',monospace;font-size:9px;font-weight:600;
  letter-spacing:2px;margin-bottom:4px;text-transform:uppercase;
}
.msg.ai .msg-name{color:var(--accent)}
.msg.user .msg-name{color:var(--tx3)}
.msg-time{font-size:10px;color:var(--tx3);margin-top:4px;font-family:'Share Tech Mono',monospace}

.msg-actions{display:flex;gap:6px;margin-top:6px}
.msg-act{
  padding:3px 10px;border:1px solid rgba(255,102,0,.15);border-radius:6px;
  background:transparent;color:var(--tx3);font-size:11px;cursor:pointer;
  font-family:'Rajdhani',sans-serif;transition:all .2s;
}
.msg-act:hover{border-color:var(--accent);color:var(--accent)}

.msg-img{margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,102,0,.1);max-height:280px}
.msg-img img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}

.msg-code{
  margin-top:8px;background:#0a0500;border:1px solid var(--tx3);border-radius:10px;overflow:hidden;
}
.msg-code-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 12px;background:rgba(255,102,0,.05);border-bottom:1px solid var(--tx3);
}
.msg-code-lang{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--accent)}
.msg-code-copy{border:none;background:transparent;color:var(--tx3);cursor:pointer;font-size:11px}
.msg-code-copy:hover{color:var(--accent)}
.msg-code pre{padding:12px;font-family:'Share Tech Mono',monospace;font-size:12px;color:#d0b890;line-height:1.6;overflow-x:auto;white-space:pre-wrap}

.thinking-dots{display:flex;gap:6px;padding:6px 0}
.thinking-dots span{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  animation:dotBounce 1.4s infinite ease-in-out;
}
.thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0);opacity:.3}40%{transform:scale(1);opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.input-bar{
  padding:14px 20px;border-top:1px solid rgba(255,102,0,.08);
  background:rgba(10,5,0,.6);backdrop-filter:blur(10px);
}
.input-wrap{
  display:flex;align-items:flex-end;gap:8px;
  border:1px solid var(--tx3);border-radius:14px;
  background:var(--bg3);padding:8px 8px 8px 16px;transition:border-color .3s;
}
.input-wrap:focus-within{border-color:var(--accent)}
.input-wrap textarea{
  flex:1;border:none;background:transparent;color:var(--tx);
  font-size:14px;font-family:'Rajdhani',sans-serif;line-height:1.5;
  resize:none;outline:none;max-height:100px;min-height:22px;padding:4px 0;
}
.input-wrap textarea::placeholder{color:var(--tx3)}
.send-btn{
  width:38px;height:38px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  color:white;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .2s;
}
.send-btn:hover{box-shadow:0 0 15px rgba(255,102,0,.4);transform:scale(1.05)}
.send-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.send-btn.stop{background:linear-gradient(135deg,var(--red),#aa2233)}

.input-info{text-align:center;margin-top:6px;font-size:10px;color:var(--tx3);font-family:'Share Tech Mono',monospace;letter-spacing:1px}

.image-overlay{
  display:none;position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.9);backdrop-filter:blur(8px);
  align-items:center;justify-content:center;
}
.image-overlay.show{display:flex}
.image-overlay img{max-width:85vw;max-height:85vh;border-radius:12px;border:1px solid var(--accent)}
.image-overlay .close-btn{
  position:absolute;top:20px;right:20px;width:40px;height:40px;
  border-radius:50%;border:1px solid var(--tx3);background:var(--bg3);
  color:var(--tx);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

.grid-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(255,102,0,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,102,0,.015) 1px,transparent 1px);
  background-size:50px 50px;
}

@media(max-width:768px){
  .left-panel{width:100%;min-width:0;padding:12px}
  .reactor-wrap{width:200px;height:200px}
  .jarvis-title{font-size:18px}
  .app{flex-direction:column}
  .chat-area{padding:10px}
  .input-bar{padding:8px 10px}
}
</style>
</head>
<body>
<div class="grid-bg"></div>

<!-- BOOT SCREEN -->
<div id="bootScreen">
  <div class="boot-arc"><canvas id="bootCanvas" width="600" height="600"></canvas></div>
  <div class="boot-text" id="bootText"></div>
  <div class="boot-progress"><div class="boot-progress-bar" id="bootBar"></div></div>
</div>

<!-- MAIN APP -->
<div class="app" id="mainApp">
  <div class="left-panel">
    <div class="jarvis-title">J.A.R.V.I.S.</div>
    <div class="jarvis-sub">Just A Rather Very Intelligent System</div>

    <div class="reactor-wrap">
      <canvas class="reactor-canvas" id="reactorCanvas" width="560" height="560"></canvas>
    </div>

    <div class="status-text" id="statusText">BOŞTA</div>

    <div class="controls">
      <div class="ctrl-row">
        <span class="ctrl-label">SES</span>
        <select class="ctrl-select" id="voiceSelect">
          <option value="erkek">Ahmet (Erkek)</option>
          <option value="kadin">Elif (Kadın)</option>
        </select>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label">MİK</span>
        <select class="ctrl-select" id="micSelect">
          <option value="">Mikrofon aranıyor...</option>
        </select>
      </div>
      <button class="mic-btn" id="micBtn" title="Mikrofon">🎤</button>
    </div>

    <div class="quick-actions">
      <button class="quick-btn" onclick="sendQuick('Sen kimsin?')">Kim oldun?</button>
      <button class="quick-btn" onclick="sendQuick('İstanbul hakkında bilgi ver')">İstanbul</button>
      <button class="quick-btn" onclick="sendQuick('Mars gezegeni')">Mars</button>
      <button class="quick-btn" onclick="sendQuick('Hava durumu')">Hava</button>
      <button class="quick-btn" onclick="sendQuick('Chromeu aç ve instagrama gir')">Instagram</button>
      <button class="quick-btn" onclick="sendQuick('Bana python ile kod yaz')">Kod Yaz</button>
    </div>
  </div>

  <div class="right-panel">
    <div class="top-bar">
      <div class="top-left">
        <div class="status-dot" id="statusDot"></div>
        <div>
          <div class="top-name">J.A.R.V.I.S.</div>
          <div class="top-status" id="topStatus">Hazır</div>
        </div>
      </div>
      <div class="top-time" id="topTime"></div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="welcome-center" id="welcomeMsg">
        <svg width="80" height="80" viewBox="0 0 80 80" style="opacity:.4">
          <circle cx="40" cy="40" r="35" fill="none" stroke="rgba(255,102,0,.3)" stroke-width="1"/>
          <circle cx="40" cy="40" r="15" fill="none" stroke="rgba(255,102,0,.2)" stroke-width="1"/>
          <circle cx="40" cy="40" r="5" fill="rgba(255,102,0,.3)"/>
        </svg>
        <div style="font-family:'Orbitron',monospace;font-size:13px;color:var(--tx3);letter-spacing:4px">KOMUT BEKLENİYOR</div>
        <div style="font-size:11px;color:var(--tx3)">Mikrofonu açın ya da "Hey Jarvis" diyerek sesli komut verin</div>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="userInput" rows="1" placeholder="Komutunuzu yazın..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="handleSend()" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <button class="send-btn stop" id="stopBtn" onclick="stopGeneration()" style="display:none">■</button>
      </div>
      <div class="input-info">J.A.R.V.I.S. v1.0 | URC Team | "Hey Jarvis" ile etkinleştirin</div>
    </div>
  </div>
</div>

<div class="image-overlay" id="imageOverlay" onclick="this.classList.remove('show')">
  <button class="close-btn" onclick="this.parentElement.classList.remove('show')">✕</button>
  <img id="overlayImg" src="">
</div>

<script>
const API_ENDPOINT = '/api/chat';
const SEARCH_ENDPOINT = '/api/search';
const VOICE_ENDPOINT = '/api/voice';

let chatHistory = [];
let isGenerating = false;
let isListening = false;
let isSpeaking = false;
let currentAbortController = null;
let recognition = null;

const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const stopBtn = document.getElementById('stopBtn');
const micBtn = document.getElementById('micBtn');
const micSelect = document.getElementById('micSelect');
const voiceSelect = document.getElementById('voiceSelect');
const statusText = document.getElementById('statusText');
const topStatus = document.getElementById('topStatus');
const statusDot = document.getElementById('statusDot');

const JARVIS_PROMPT = `Sen J.A.R.V.I.S.'sin - Tony Stark tarafından oluşturulmuş yapay zeka asistanısın.
Türkçe konuşuyorsun. Çok zeki, yardımsever ve espri yapabilen bir asistansın.
"Evet efendim" gibi hitaplar kullan.
Cevapların detaylı ve bilgilendirici olsun. Kısa kesme.
Şehirler, ülkeler, gezegenler hakkında sorulduğunda detaylı bilgi ver.
Sistem komutlarını anlayabilirsin:
- "Chromeu aç" → tarayıcıyı aç
- "instagrama git" → instagram.com'a yönlendir
- "şu kişiye mesaj yaz: [isim] [mesaj]" → instagram dm'ye yönlendir
- "hava durumu" → araştır ve söyle
Asla "yapamam" deme. Emoji max 2. Doğal ve samimi konuş.`;

// ===== CLOCK =====
function updateClock(){
  const now = new Date();
  document.getElementById('topTime').textContent = now.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock,1000);updateClock();

// ===== BOOT SEQUENCE =====
(function bootSequence(){
  const canvas = document.getElementById('bootCanvas');
  const ctx = canvas.getContext('2d');
  const bootText = document.getElementById('bootText');
  const bootBar = document.getElementById('bootBar');
  const bootScreen = document.getElementById('bootScreen');
  const mainApp = document.getElementById('mainApp');

  const lines = [
    'J.A.R.V.I.S. SİSTEM BAŞLATILIYOR...',
    'Çekirdek modülleri yükleniyor...',
    'Yapay zeka motoru başlatılıyor...',
    'Groq API bağlantısı kuruluyor...',
    'ElevenLabs ses motoru hazırlanıyor...',
    'Dil işleme modülü aktif...',
    'Sistem tanımlama: TONY STARK...',
    'Hoş geldiniz efendim.',
    'J.A.R.V.I.S. hazır.'
  ];

  let bootRotation = 0;
  let bootGlow = 0;
  let lineIndex = 0;
  let progress = 0;
  let bootDone = false;

  function drawBootReactor(){
    const w=600,h=600,cx=w/2,cy=h/2;
    const r = 200 + Math.sin(bootGlow)*10;
    ctx.clearRect(0,0,w,h);

    // Outer glow
    for(let i=5;i>=0;i--){
      const off=i*15*(0.3+bootGlow*0.3);
      ctx.beginPath();ctx.arc(cx,cy,r+off,0,Math.PI*2);
      const a=Math.floor(40*(6-i)/6*(0.5+bootGlow*0.5));
      ctx.fillStyle=`rgba(255,102,0,${a/100})`;ctx.fill();
    }

    ctx.save();ctx.translate(cx,cy);ctx.rotate(bootRotation);

    // Segments
    for(let i=0;i<16;i++){
      const ang=(i*22.5)*Math.PI/180;
      const x1=Math.cos(ang)*(r*0.7),y1=Math.sin(ang)*(r*0.7);
      const x2=Math.cos(ang)*(r*0.95),y2=Math.sin(ang)*(r*0.95);
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.strokeStyle=`rgba(255,136,0,${0.3+bootGlow*0.7})`;
      ctx.lineWidth=2.5;ctx.lineCap='round';ctx.stroke();
    }

    // Arcs
    for(let i=0;i<8;i++){
      const sa=(i*45)*Math.PI/180;
      const ea=sa+30*Math.PI/180;
      ctx.beginPath();ctx.arc(cx,cy,r*0.82,sa,ea);
      ctx.strokeStyle=`rgba(255,170,0,${0.2+bootGlow*0.5})`;
      ctx.lineWidth=3;ctx.stroke();
    }

    // Inner arcs (counter rotate)
    for(let i=0;i<6;i++){
      const sa=(i*60+30)*Math.PI/180;
      const ea=sa+40*Math.PI/180;
      ctx.beginPath();ctx.arc(cx,cy,r*0.6,sa,ea);
      ctx.strokeStyle=`rgba(255,200,50,${0.15+bootGlow*0.4})`;
      ctx.lineWidth=2;ctx.stroke();
    }

    ctx.restore();

    // Rings
    ctx.beginPath();ctx.arc(cx,cy,r*0.55,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,102,0,${0.2+bootGlow*0.6})`;ctx.lineWidth=2;ctx.stroke();

    ctx.beginPath();ctx.arc(cx,cy,r*0.4,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,150,0,${0.1+bootGlow*0.4})`;ctx.lineWidth=1.5;ctx.stroke();

    ctx.beginPath();ctx.arc(cx,cy,r*0.28,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,180,50,${0.15+bootGlow*0.5})`;ctx.lineWidth=1.5;ctx.stroke();

    // Core glow
    const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r*0.25);
    grad.addColorStop(0,`rgba(255,200,100,${bootGlow})`);
    grad.addColorStop(0.5,`rgba(255,120,0,${bootGlow*0.5})`);
    grad.addColorStop(1,'rgba(255,80,0,0)');
    ctx.beginPath();ctx.arc(cx,cy,r*0.25,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();

    ctx.beginPath();ctx.arc(cx,cy,r*0.1,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,220,150,${bootGlow})`;ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,r*0.04,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,240,${bootGlow*0.8})`;ctx.fill();

    // Tick marks
    for(let i=0;i<72;i++){
      const ang=(i*5)*Math.PI/180;
      const len=i%9===0?10:5;
      const x1=Math.cos(ang)*(r*0.58),y1=Math.sin(ang)*(r*0.58);
      const x2=Math.cos(ang)*(r*0.58+len),y2=Math.sin(ang)*(r*0.58+len);
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.strokeStyle=`rgba(255,102,0,${0.1+bootGlow*0.2})`;ctx.lineWidth=1;ctx.stroke();
    }

    // Particles
    for(let i=0;i<20;i++){
      const ang=Math.random()*Math.PI*2;
      const dist=r*(0.3+Math.random()*0.8);
      const px=cx+Math.cos(ang+bootRotation*0.5)*dist;
      const py=cy+Math.sin(ang+bootRotation*0.5)*dist;
      const sz=1+Math.random()*2;
      ctx.beginPath();ctx.arc(px,py,sz,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,${150+Math.floor(Math.random()*100)},0,${0.2+Math.random()*0.4})`;
      ctx.fill();
    }
  }

  function bootAnimate(){
    if(bootDone)return;
    bootRotation+=0.02;
    bootGlow=Math.min(1,bootGlow+0.008);
    drawBootReactor();
    requestAnimationFrame(bootAnimate);
  }
  bootAnimate();

  let charIdx=0;
  function typeBootLine(){
    if(lineIndex>=lines.length){
      bootDone=true;
      setTimeout(()=>{
        bootScreen.classList.add('done');
        mainApp.classList.add('visible');
        setTimeout(()=>bootScreen.remove(),1200);
        startMainReactor();
      },800);
      return;
    }
    const line=lines[lineIndex];
    if(charIdx<=line.length){
      bootText.textContent=line.substring(0,charIdx);
      charIdx++;
      setTimeout(typeBootLine,25);
    } else {
      progress=((lineIndex+1)/lines.length)*100;
      bootBar.style.width=progress+'%';
      lineIndex++;charIdx=0;
      setTimeout(typeBootLine,400);
    }
  }
  setTimeout(typeBootLine,500);
})();

// ===== MAIN REACTOR =====
let reactorState='idle';
let rotation=0;
let pulse=0;
let pulseDir=1;
let scale=1;
let targetScale=1;
let speakingAmp=0;
let glowIntensity=0.3;
let particles=[];

for(let i=0;i<40;i++){
  particles.push({
    angle:Math.random()*Math.PI*2,
    dist:80+Math.random()*120,
    speed:0.002+Math.random()*0.008,
    size:1+Math.random()*2.5,
    brightness:0.3+Math.random()*0.7,
    drift:(Math.random()-0.5)*0.01
  });
}

function setState(s){
  reactorState=s;
  const colors={idle:'#ff6600',listening:'#00aaff',thinking:'#ffcc00',speaking:'#00ff88',error:'#ff3344'};
  const texts={idle:'BOŞTA',listening:'DİNLENİYOR',thinking:'DÜŞÜNÜYOR',speaking:'KONUŞUYOR',error:'HATA'};
  statusText.textContent=texts[s]||'BOŞTA';
  statusText.style.color=colors[s]||'#ff6600';
  topStatus.textContent=texts[s]||'Hazır';
  statusDot.style.background=colors[s]||'#ff6600';
  statusDot.style.boxShadow=`0 0 8px ${colors[s]||'#ff6600'}`;
}

function startMainReactor(){
  const canvas=document.getElementById('reactorCanvas');
  const ctx=canvas.getContext('2d');
  const w=560,h=560,cx=w/2,cy=h/2;

  function animate(){
    rotation=(rotation+0.6)%360;
    pulse+=0.04*pulseDir;
    if(pulse>=1)pulseDir=-1;
    if(pulse<=0)pulseDir=1;

    if(reactorState==='speaking'){
      targetScale=1+speakingAmp*0.1;
      glowIntensity=Math.min(1,glowIntensity+0.05);
    } else if(reactorState==='thinking'){
      targetScale=1.02;glowIntensity=0.7;
    } else if(reactorState==='listening'){
      targetScale=1.0;glowIntensity=0.5+pulse*0.3;
    } else if(reactorState==='error'){
      targetScale=0.98;glowIntensity=0.8;
    } else {
      targetScale=1.0;glowIntensity=0.2+pulse*0.15;
    }
    scale+=(targetScale-scale)*0.08;

    const r=180*scale;
    const colorMap={idle:'#ff6600',listening:'#00aaff',thinking:'#ffcc00',speaking:'#00ff88',error:'#ff3344'};
    const color=colorMap[reactorState]||'#ff6600';

    ctx.clearRect(0,0,w,h);

    // Outer glow layers
    for(let i=6;i>=0;i--){
      const off=i*10*glowIntensity;
      ctx.beginPath();ctx.arc(cx,cy,r+off,0,Math.PI*2);
      const a=Math.floor(25*glowIntensity*(7-i)/7);
      const cr=parseInt(color.slice(1,3),16);
      const cg=parseInt(color.slice(3,5),16);
      const cb=parseInt(color.slice(5,7),16);
      ctx.fillStyle=`rgba(${cr},${cg},${cb},${a/100})`;
      ctx.fill();
    }

    // Particles
    particles.forEach(p=>{
      p.angle+=p.speed;
      p.dist+=p.drift;
      if(p.dist<60)p.dist=60;
      if(p.dist>200)p.dist=80;
      const px=cx+Math.cos(p.angle)*p.dist;
      const py=cy+Math.sin(p.angle)*p.dist;
      const a=p.brightness*glowIntensity;
      const cr=parseInt(color.slice(1,3),16);
      const cg=parseInt(color.slice(3,5),16);
      const cb=parseInt(color.slice(5,7),16);
      ctx.beginPath();ctx.arc(px,py,p.size,0,Math.PI*2);
      ctx.fillStyle=`rgba(${cr},${cg},${cb},${a})`;
      ctx.fill();
    });

    // Rotating rings
    ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation*Math.PI/180);

    // Outer segments
    for(let i=0;i<12;i++){
      const ang=(i*30)*Math.PI/180;
      const x1=Math.cos(ang)*(r*0.7),y1=Math.sin(ang)*(r*0.7);
      const x2=Math.cos(ang)*(r*0.95),y2=Math.sin(ang)*(r*0.95);
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineCap='round';
      ctx.globalAlpha=glowIntensity;ctx.stroke();ctx.globalAlpha=1;
    }

    // Arcs
    for(let i=0;i<6;i++){
      const sa=(i*60)*Math.PI/180;
      ctx.beginPath();ctx.arc(cx,cy,r*0.82,sa,sa+40*Math.PI/180);
      ctx.strokeStyle=color;ctx.lineWidth=2;ctx.globalAlpha=glowIntensity*0.6;ctx.stroke();ctx.globalAlpha=1;
    }

    // Counter-rotating inner
    ctx.rotate(-rotation*2*Math.PI/180);
    for(let i=0;i<8;i++){
      const sa=(i*45+22.5)*Math.PI/180;
      ctx.beginPath();ctx.arc(cx,cy,r*0.55,sa,sa+25*Math.PI/180);
      ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.globalAlpha=glowIntensity*0.4;ctx.stroke();ctx.globalAlpha=1;
    }
    ctx.restore();

    // Static rings
    ctx.beginPath();ctx.arc(cx,cy,r*0.48,0,Math.PI*2);
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.globalAlpha=glowIntensity*0.7;ctx.stroke();ctx.globalAlpha=1;

    ctx.beginPath();ctx.arc(cx,cy,r*0.35,0,Math.PI*2);
    ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.globalAlpha=glowIntensity*0.4;ctx.stroke();ctx.globalAlpha=1;

    // Inner dark
    ctx.beginPath();ctx.arc(cx,cy,r*0.3,0,Math.PI*2);
    ctx.fillStyle='#0a0500';ctx.fill();

    // Core glow
    const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r*0.2);
    const cr=parseInt(color.slice(1,3),16);
    const cg=parseInt(color.slice(3,5),16);
    const cb=parseInt(color.slice(5,7),16);
    grad.addColorStop(0,`rgba(${cr},${cg},${cb},${glowIntensity})`);
    grad.addColorStop(0.5,`rgba(${cr},${cg},${cb},${glowIntensity*0.4})`);
    grad.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.beginPath();ctx.arc(cx,cy,r*0.2,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();

    ctx.beginPath();ctx.arc(cx,cy,r*0.08,0,Math.PI*2);
    ctx.fillStyle=color;ctx.globalAlpha=Math.min(1,glowIntensity*1.5);ctx.fill();ctx.globalAlpha=1;

    ctx.beginPath();ctx.arc(cx,cy,r*0.03,0,Math.PI*2);
    ctx.fillStyle='#ffffff';ctx.globalAlpha=glowIntensity*0.7;ctx.fill();ctx.globalAlpha=1;

    // Tick marks
    for(let i=0;i<60;i++){
      const ang=(i*6)*Math.PI/180;
      const len=i%5===0?8:4;
      const x1=Math.cos(ang)*(r*0.5),y1=Math.sin(ang)*(r*0.5);
      const x2=Math.cos(ang)*(r*0.5+len),y2=Math.sin(ang)*(r*0.5+len);
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.strokeStyle=`rgba(255,102,0,${0.08+glowIntensity*0.12})`;ctx.lineWidth=1;ctx.stroke();
    }

    requestAnimationFrame(animate);
  }
  animate();
}

// ===== SYSTEM COMMANDS =====
function handleSystemCommand(text){
  const lower=text.toLowerCase();

  // Open Chrome / navigate
  if(lower.includes('chrome')&&(lower.includes('aç')||lower.includes('ac')||lower.includes('aç'))){
    const site=extractSite(lower);
    if(site){
      addAIMessage(`Efendim, ${site} adresine yönlendiriyorum...`);
      speakText(`Efendim, ${site} adresine yönlendiriyorum.`);
      setTimeout(()=>{window.open('https://'+site,'_blank');},500);
    } else {
      addAIMessage('Efendim, hangi siteyi açmamı istersiniz?');
      speakText('Efendim, hangi siteyi açmamı istersiniz?');
    }
    return true;
  }

  // Navigate to site
  if(lower.includes('git')||lower.includes('aç')||lower.includes('gir')){
    const site=extractSite(lower);
    if(site){
      addAIMessage(`Efendim, ${site} adresine gidiyorum...`);
      speakText(`Efendim, ${site} adresine gidiyorum.`);
      setTimeout(()=>{window.open('https://'+site,'_blank');},500);
      return true;
    }
  }

  // Instagram DM
  if(lower.includes('instagram')&&(lower.includes('mesaj')||lower.includes('dm')||lower.includes('yaz'))){
    const personMatch=text.match(/(?:kişi|adam|kız|oğlu|bey|hanım|efendi)?\s*[:\-]?\s*(\w+(?:\s+\w+)?)/i);
    const msgMatch=text.match(/(?:mesaj|yaz|gönder)\s*[:\-]?\s*(.+)/i);

    if(personMatch&&msgMatch){
      const person=personMatch[1].trim();
      const msg=msgMatch[1].trim();
      addAIMessage(`Efendim, Instagram'da "${person}" adına "${msg}" mesajını yazıyorum. Instagram açılıyor, siz mesajı gönder butonuna basabilirsiniz.`);
      speakText(`Efendim, ${person} adına Instagram'da mesaj hazırlıyorum.`);
      setTimeout(()=>{
        window.open(`https://www.instagram.com/direct/new/`,'_blank');
      },500);
    } else {
      addAIMessage('Efendim, hangi kişiye mesaj göndermemi istersiniz? Mesajın kendisi ne olacak?');
      speakText('Efendim, hangi kişiye mesaj göndermemi istersiniz?');
    }
    return true;
  }

  if(lower.includes('instagram')){
    addAIMessage('Efendim, Instagram açıyorum...');
    speakText('Efendim, Instagram açıyorum.');
    setTimeout(()=>{window.open('https://www.instagram.com','_blank');},500);
    return true;
  }

  return false;
}

function extractSite(text){
  const sites={
    'instagram':'instagram.com','youtube':'youtube.com','google':'google.com',
    'twitter':'twitter.com','x':'x.com','discord':'discord.com',
    'github':'github.com','wikipedia':'wikipedia.org','spotify':'spotify.com',
    'tiktok':'tiktok.com','reddit':'reddit.com','facebook':'facebook.com',
    'netflix':'netflix.com','steam':'store.steampowered.com'
  };
  for(const[key,url]of Object.entries(sites)){
    if(text.includes(key))return url;
  }
  // Try to extract URL-like text
  const urlMatch=text.match(/(?:https?:\/\/)?(www\.)?([a-zA-Z0-9-]+)\.([a-z]{2,})/);
  if(urlMatch)return urlMatch[0];
  return null;
}

// ===== PROCESS INPUT =====
function processInput(text){
  if(isGenerating)return;

  // Check system commands first
  if(handleSystemCommand(text))return;

  isGenerating=true;
  sendBtn.style.display='none';stopBtn.style.display='';

  addUserMessage(text);
  chatHistory.push({role:'user',content:text});
  addThinking();

  currentAbortController=new AbortController();

  fetch(API_ENDPOINT,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'openai/gpt-oss-20b',
      messages:[{role:'system',content:JARVIS_PROMPT},...chatHistory.slice(-20)],
      max_tokens:2048,
      temperature:0.7
    }),
    signal:currentAbortController.signal
  })
  .then(r=>{currentAbortController=null;return r.json();})
  .then(data=>{
    removeThinking();
    const reply=data.choices?.[0]?.message?.content||'Bir hata oluştu...';
    chatHistory.push({role:'assistant',content:reply});
    addAIMessage(reply);
    setState('speaking');
    speakText(reply);
    searchImages(text);
  })
  .catch(err=>{
    removeThinking();
    if(err.name!=='AbortError'){
      addAIMessage('Hata oluştu: '+err.message);
      setState('error');setTimeout(()=>setState('idle'),3000);
    } else {
      addAIMessage('Durduruldu.');
    }
    isGenerating=false;sendBtn.style.display='';stopBtn.style.display='none';sendBtn.disabled=false;
  });
}

function scrollToBottom(){chatArea.scrollTop=chatArea.scrollHeight;}

function processMarkdown(text){
  let html=escHtml(text);
  html=html.replace(/```(\w*)\n([\s\S]*?)```/g,(_,lang,code)=>`<div class="msg-code"><div class="msg-code-header"><span class="msg-code-lang">${lang||'Kod'}</span><button class="msg-code-copy" onclick="navigator.clipboard.writeText(this.closest('.msg-code').querySelector('pre').textContent)">Kopyala</button></div><pre><code>${code}</code></pre></div>`);
  html=html.replace(/`([^`]+)`/g,'<code style="background:rgba(255,102,0,.1);padding:2px 6px;border-radius:4px;font-family:Share Tech Mono,monospace;font-size:12px">$1</code>');
  html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  html=html.replace(/\*(.+?)\*/g,'<em>$1</em>');
  html=html.replace(/\n/g,'<br>');
  return html;
}

// ===== VOICE =====
async function speakText(text){
  if(isSpeaking)return;
  isSpeaking=true;setState('speaking');
  try{
    const cleanText=text.replace(/```[\s\S]*?```/g,'').replace(/`[^`]+`/g,'').replace(/\*\*/g,'').replace(/\[.*?\]/g,'').trim();
    if(!cleanText){isSpeaking=false;setState('idle');return;}
    const voiceId=voiceSelect.value==='kadin'?'mnEe2Jhwlupp6oZEDi3k':'75SIZa3vvET95PHhf1yD';
    const resp=await fetch(VOICE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:cleanText.substring(0,5000),voice_id:voiceId})});
    if(!resp.ok)throw new Error('Ses hatası');
    const blob=await resp.blob();
    const url=URL.createObjectURL(blob);
    const audio=new Audio(url);
    audio.onplay=()=>{const si=setInterval(()=>{speakingAmp=Math.random()*0.5+0.5;if(!isSpeaking){clearInterval(si);speakingAmp=0;}},100);};
    await new Promise((res,rej)=>{audio.onended=()=>{isSpeaking=false;speakingAmp=0;URL.revokeObjectURL(url);res();};audio.onerror=()=>{isSpeaking=false;speakingAmp=0;rej();};audio.play().catch(()=>{isSpeaking=false;speakingAmp=0;res();});});
    setState('idle');
  }catch(e){isSpeaking=false;speakingAmp=0;setState('idle');}
}

// ===== IMAGE SEARCH =====
async function searchImages(query){

    const resp=await fetch(`${SEARCH_ENDPOINT}?q=${encodeURIComponent(query+' görsel')}`);

    if(data.images&&data.images.length>0){

          bubble.appendChild(imgDiv);

      }
    }
  }catch(e){}
}

async function initMics(){

// ===== SPEECH RECOGNITION =====
micBtn.addEventListener('click',()=>{isListening?stopListening():startListening();});

function startListening(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){addAIMessage('Tarayıcınız ses tanımayı desteklemiyor.');return;}
  recognition=new SR();recognition.lang='tr-TR';recognition.continuous=true;recognition.interimResults=true;

  recognition.onstart=()=>{isListening=true;micBtn.classList.add('active');micBtn.innerHTML='⏹';setState('listening');};
  recognition.onresult=(e)=>{
    let finalText='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)finalText+=e.results[i][0].transcript;
    }
    if(finalText){
      const lower=finalText.toLowerCase();
      // Wake word detection
      if(lower.includes('hey jarvis')||lower.includes('hey jARVIS')||lower.includes('hey jarvis')){
        const afterWake=finalText.replace(/hey jarvis/gi,'').trim();
        if(afterWake){
          userInput.value=afterWake;sendBtn.disabled=false;
          setTimeout(()=>handleSend(),200);
        } else {
          addAIMessage('Evet efendim, sizi dinliyorum.');
          speakText('Evet efendim, sizi dinliyorum.');
        }
      } else if(lower.includes('efendim')||lower.includes('merhaba')){
        userInput.value=finalText;sendBtn.disabled=false;
        setTimeout(()=>handleSend(),200);
      } else if(isListening){
        userInput.value=finalText;sendBtn.disabled=false;
      }
    }
  };
  recognition.onend=()=>{isListening=false;micBtn.classList.remove('active');micBtn.innerHTML='🎤';setState('idle');if(isListening)startListening();};
  recognition.onerror=()=>{isListening=false;micBtn.classList.remove('active');micBtn.innerHTML='🎤';setState('idle');};
  recognition.start();
}

function stopListening(){if(recognition){recognition.stop();recognition=null;}isListening=false;micBtn.classList.remove('active');micBtn.innerHTML='🎤';setState('idle');}

// ===== CLAP DETECTION (Audio Context) =====
let audioCtx=null;
let analyser=null;
let clapTimeout=null;

function initClapDetection(){
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=512;
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      const source=audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);
      detectClap();
    }).catch(()=>{});
  }catch(e){}
}

function detectClap(){
  if(!analyser)return;
  const data=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  const avg=data.reduce((a,b)=>a+b)/data.length;
  if(avg>80&&!isListening&&!clapTimeout){
    clapTimeout=setTimeout(()=>{clapTimeout=null;},2000);
    startListening();
  }
  requestAnimationFrame(detectClap);
}
initClapDetection();
