[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/voice"
  to = "/.netlify/functions/voice"
  status = 200

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/chat"
  status = 200
